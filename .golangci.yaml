# golangci-lint configuration for C8S
# See https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 10m
  go: "1.25"
  modules-download-mode: readonly
  tests: true

linters:
  enable:
    - govet          # Go vet examines Go source code
    - errcheck       # Check for unchecked errors
    - staticcheck    # Staticcheck is a go vet on steroids
    - unused         # Check for unused constants, variables, functions
    - ineffassign    # Detect ineffectual assignments
    - gocritic       # Comprehensive Go linter
    - misspell       # Spelling mistakes
    - revive         # Fast, configurable, extensible, flexible linter
    - bodyclose      # Check HTTP response bodies are closed
    - nilerr         # Find code returning nil with non-nil error
    - nolintlint     # Ill-formed or insufficient nolint directives
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Reports unused function parameters
    - goconst        # Find repeated strings that could be constants
    - gocyclo        # Cyclomatic complexity
    - nestif         # Report deeply nested if statements

  # Exclude some linters from running on tests
  exclusions:
    rules:
      # Test files - disable linters that are less relevant for testing
      - path: ".*_test\\.go$"
        linters:
          - gocyclo      # Complex test setup is OK
          - errcheck     # Unchecked errors in cleanup are acceptable
          - goconst      # String constants in tests are OK
          - unparam      # Unused params common in test helpers
          - revive       # Unused parameters in handlers/mocks are common
          - nestif       # Nested conditions in test setup OK
          - staticcheck  # Some test patterns flagged aren't critical
          - gocritic     # Style checks less critical in tests

      # Exclude known issues in generated code
      - path: zz_generated\.deepcopy\.go
        linters:
          - gocritic
          - gocyclo
          - revive
          - errcheck
          - staticcheck

  settings:
    gocyclo:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code

    misspell:
      locale: US

    nestif:
      min-complexity: 5

