name: Tilt CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tilt-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install devbox
      uses: jetify-com/devbox-install-action@v0.12.0
      with:
        enable-cache: true

    - name: Set up Kind cluster
      uses: helm/kind-action@v1.7.0
      with:
        cluster_name: c8s
        config: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: c8s
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 80
              hostPort: 8080
              listenAddress: "127.0.0.1"
            - containerPort: 443
              hostPort: 8443
              listenAddress: "127.0.0.1"

    - name: Install Tilt
      run: |
        TILT_VERSION="v0.33.14"
        TILT_ARCH="x86_64"
        TILT_OS="linux"
        TILT_URL="https://github.com/tilt-dev/tilt/releases/download/${TILT_VERSION}/tilt.${TILT_VERSION}.${TILT_OS}.${TILT_ARCH}.tar.gz"
        curl -fsSL -o tilt.tar.gz "$TILT_URL"
        tar xzf tilt.tar.gz
        sudo mv tilt /usr/local/bin/
        rm tilt.tar.gz

    - name: Install ctlptl (optional but helpful)
      run: |
        CTLPTL_VERSION="v0.8.35"
        CTLPTL_ARCH="x86_64"
        CTLPTL_OS="linux"
        CTLPTL_URL="https://github.com/tilt-dev/ctlptl/releases/download/${CTLPTL_VERSION}/ctlptl.${CTLPTL_VERSION}.${CTLPTL_OS}.${CTLPTL_ARCH}.tar.gz"
        curl -fsSL -o ctlptl.tar.gz "$CTLPTL_URL"
        tar xzf ctlptl.tar.gz
        sudo mv ctlptl /usr/local/bin/
        rm ctlptl.tar.gz
      continue-on-error: true

    - name: Run Tilt CI
      run: |
        devbox run -- tilt:ci
      env:
        DOCKER_HOST: unix:///var/run/docker.sock

    - name: Check cluster status on failure
      if: failure()
      run: |
        echo "=== Cluster Info ==="
        kubectl cluster-info

        echo -e "\n=== Nodes ==="
        kubectl get nodes -o wide

        echo -e "\n=== All Pods ==="
        kubectl get pods -A -o wide

        echo -e "\n=== C8S Namespace ==="
        kubectl get all -n c8s-system -o wide || true

        echo -e "\n=== Recent Events ==="
        kubectl get events -A --sort-by='.lastTimestamp' | tail -20

    - name: Upload Tilt logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: tilt-logs
        path: |
          ~/.tilt/
          /tmp/tilt-*
        retention-days: 7
      continue-on-error: true
