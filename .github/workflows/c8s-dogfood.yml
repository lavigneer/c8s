name: C8S Dog-Fooding - Trigger Local C8S Pipeline

on:
  push:
    branches: [ main, develop, 'release-*' ]
  pull_request:
    branches: [ main, develop, 'release-*' ]

jobs:
  trigger-c8s-pipeline:
    name: Trigger C8S Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check if secrets are configured
        id: check-secrets
        env:
          C8S_BASE_URL: ${{ secrets.C8S_BASE_URL }}
        run: |
          if [ -z "$C8S_BASE_URL" ]; then
            echo "⚠️ Skipping: C8S_BASE_URL secret not configured"
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "configured=true" >> $GITHUB_OUTPUT

      - name: Checkout code
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Create GitHub webhook payload
        if: steps.check-secrets.outputs.configured == 'true'
        id: payload
        run: |
          cat > webhook-payload.json << 'EOF'
          {
            "ref": "refs/heads/${{ github.ref_name }}",
            "before": "0000000000000000000000000000000000000000",
            "after": "${{ github.sha }}",
            "repository": {
              "id": ${{ github.repository_id }},
              "name": "${{ github.event.repository.name }}",
              "full_name": "${{ github.repository }}",
              "private": false,
              "owner": {
                "name": "${{ github.repository_owner }}",
                "login": "${{ github.repository_owner }}"
              },
              "html_url": "${{ github.server_url }}/${{ github.repository }}",
              "description": "C8S Repository",
              "url": "${{ github.server_url }}/${{ github.repository }}.git",
              "clone_url": "https://github.com/${{ github.repository }}.git",
              "ssh_url": "git@github.com:${{ github.repository }}.git"
            },
            "pusher": {
              "name": "${{ github.actor }}",
              "email": "${{ github.actor }}@users.noreply.github.com"
            },
            "sender": {
              "login": "${{ github.actor }}"
            },
            "created": false,
            "deleted": false,
            "forced": false,
            "compare": "${{ github.server_url }}/${{ github.repository }}/compare/${{ github.sha }}",
            "commits": [
              {
                "id": "${{ github.sha }}",
                "message": "Triggered from GitHub Actions",
                "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
                "author": {
                  "name": "${{ github.actor }}",
                  "email": "${{ github.actor }}@users.noreply.github.com"
                }
              }
            ]
          }
          EOF

          echo "payload-file=webhook-payload.json" >> $GITHUB_OUTPUT
          cat webhook-payload.json

      - name: Test webhook connectivity
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          C8S_BASE_URL: ${{ secrets.C8S_BASE_URL }}
        run: |
          WEBHOOK_URL="$C8S_BASE_URL/webhook/webhooks/github"

          echo "Testing connectivity to webhook: $WEBHOOK_URL"
          echo "Attempting to connect with 10 second timeout..."

          # Test with GET request first
          HTTP_CODE=$(curl -m 10 -s -o /dev/null -w "%{http_code}" "$WEBHOOK_URL" 2>&1 || echo "timeout")
          echo "GET request HTTP code: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "405" ]; then
            echo "✓ Webhook endpoint is reachable"
          else
            echo "⚠️ Webhook connectivity test returned: $HTTP_CODE"
          fi

      - name: Trigger C8S Pipeline via webhook
        if: steps.check-secrets.outputs.configured == 'true'
        id: trigger
        timeout-minutes: 5
        continue-on-error: true
        env:
          C8S_BASE_URL: ${{ secrets.C8S_BASE_URL }}
        run: |
          PAYLOAD=$(cat webhook-payload.json)

          WEBHOOK_URL="$C8S_BASE_URL/webhook/webhooks/github"

          echo "=========================================="
          echo "Webhook Configuration"
          echo "=========================================="
          echo "URL: $WEBHOOK_URL"
          echo "Event: push"
          echo "Payload size: $(echo -n "$PAYLOAD" | wc -c) bytes"
          echo ""
          echo "=========================================="

          # Calculate signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hex | cut -d' ' -f2)

          echo "Sending GitHub webhook event (30 second timeout)..."
          echo "Curl command: curl -m 30 -X POST $WEBHOOK_URL ..."

          # Send webhook with timeout
          HTTP_CODE=$(curl -m 30 -s -o /tmp/webhook-response.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}-${{ github.run_number }}" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD" 2>&1)

          RESPONSE_BODY=$(cat /tmp/webhook-response.txt 2>/dev/null || echo "")

          echo "=========================================="
          echo "Webhook Response"
          echo "=========================================="
          echo "HTTP Status: $HTTP_CODE"
          echo "Response body:"
          echo "$RESPONSE_BODY"
          echo "=========================================="

          if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "✓ Pipeline trigger sent (HTTP $HTTP_CODE)"
            echo "pipeline-run-id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Webhook returned HTTP $HTTP_CODE (may still have triggered)"
            echo "This may be OK - the webhook may have processed the request asynchronously"
          fi

      - name: Get Pipeline Status
        if: steps.check-secrets.outputs.configured == 'true'
        id: status
        env:
          C8S_BASE_URL: ${{ secrets.C8S_BASE_URL }}
        run: |
          API_URL="$C8S_BASE_URL/api"
          PIPELINE_RUN="c8s-gh-${{ github.run_id }}-${{ github.run_number }}"

          echo "Polling pipeline status..."
          echo "API URL: $API_URL"
          echo "Pipeline: $PIPELINE_RUN"

          # Wait for pipeline to complete (timeout after 40 minutes)
          ELAPSED=0
          MAX_WAIT=2400  # 40 minutes in seconds
          POLL_INTERVAL=10

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -s "$API_URL/api/v1/pipelines/$PIPELINE_RUN/status" 2>/dev/null || echo '{}')
            PHASE=$(echo "$STATUS" | grep -o '"phase":"[^"]*"' | cut -d'"' -f4)

            echo "[$((ELAPSED / 60))m] Status: $PHASE"
            echo "Response: $STATUS"

            case "$PHASE" in
              "Succeeded")
                echo "✓ Pipeline completed successfully!"
                echo "pipeline-status=success" >> $GITHUB_OUTPUT
                exit 0
                ;;
              "Failed"|"Error")
                echo "✗ Pipeline failed"
                echo "pipeline-status=failed" >> $GITHUB_OUTPUT
                exit 1
                ;;
              "Running"|"Pending"|"")
                # Still running, wait and retry
                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
                ;;
            esac
          done

          echo "⚠ Pipeline status check timed out after 40 minutes"
          echo "pipeline-status=timeout" >> $GITHUB_OUTPUT
          exit 1

      - name: Fetch Pipeline Logs
        if: always() && steps.check-secrets.outputs.configured == 'true'
        continue-on-error: true
        env:
          C8S_BASE_URL: ${{ secrets.C8S_BASE_URL }}
        run: |
          API_URL="$C8S_BASE_URL/api"
          PIPELINE_RUN="c8s-gh-${{ github.run_id }}-${{ github.run_number }}"

          echo "=========================================="
          echo "C8S Pipeline Logs"
          echo "=========================================="

          curl -s "$API_URL/api/v1/pipelines/$PIPELINE_RUN/logs" 2>/dev/null || \
            echo "Could not retrieve logs from C8S API"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.check-secrets.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.status.outputs.pipeline-status }}';
            const pipelineRun = 'c8s-gh-${{ github.run_id }}-${{ github.run_number }}';
            const apiUrl = '${{ secrets.C8S_BASE_URL }}/api';

            let body = '## C8S Dog-Fooding Pipeline\n\n';

            if (status === 'success') {
              body += '✅ **Pipeline passed!** C8S successfully ran its own CI pipeline.\n\n';
            } else if (status === 'failed') {
              body += '❌ **Pipeline failed!** Check logs in the Actions workflow.\n\n';
            } else if (status === 'timeout') {
              body += '⚠️ **Pipeline status check timed out.** It may still be running.\n\n';
            }

            body += `**Pipeline Run**: \`${pipelineRun}\`\n`;
            body += `**View Details**: ${apiUrl}/pipelines/${pipelineRun}\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Report Results
        if: always() && steps.check-secrets.outputs.configured == 'true'
        env:
          C8S_BASE_URL: ${{ secrets.C8S_BASE_URL }}
        run: |
          echo "=========================================="
          echo "C8S Dog-Fooding Summary"
          echo "=========================================="
          echo "Pipeline Status: ${{ steps.status.outputs.pipeline-status }}"
          echo "Pipeline Run: c8s-gh-${{ github.run_id }}-${{ github.run_number }}"
          echo "Base URL: $C8S_BASE_URL"
          echo ""
          echo "Next Steps:"
          echo "1. View pipeline in C8S dashboard: $C8S_BASE_URL/api"
          echo "2. Check pipeline logs: $C8S_BASE_URL/api/pipelines/c8s-gh-${{ github.run_id }}-${{ github.run_number }}"
          echo "3. Monitor in Tilt: http://localhost:10350"
          echo "=========================================="
