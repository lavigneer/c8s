name: E2E Tests

on:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'cmd/api-server/**'
      - 'playwright.config.ts'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'tests/e2e/**'
      - 'cmd/api-server/**'
      - 'playwright.config.ts'
      - 'package.json'

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build CSS
        run: npm run build:css

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:8080
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/
          retention-days: 7

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsFile = 'test-results/results.json';
            if (fs.existsSync(resultsFile)) {
              const results = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
              const totalTests = results.stats.expected;
              const passedTests = results.stats.expected - results.stats.unexpected;
              const passRate = ((passedTests / totalTests) * 100).toFixed(1);

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## E2E Test Results\n\n✅ **Passed**: ${passedTests}/${totalTests}\n📊 **Pass Rate**: ${passRate}%\n\n[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
              });
            }
