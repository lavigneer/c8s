name: CI

on:
  push:
    branches: [ main, 'release-*' ]
  pull_request:
    branches: [ main, 'release-*' ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true

      - name: Run golangci-lint
        run: devbox run golangci-lint run --timeout=10m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true

      - name: Run unit tests
        run: devbox run make test-unit

      - name: Run integration tests
        run: devbox run make test-integration

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-c8s

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true

      - name: Build all binaries
        run: devbox run make build

      - name: Verify manifests
        run: |
          devbox run make manifests
          git diff --exit-code config/crd/bases

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build controller image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: controller
          push: false
          tags: c8s-controller:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build webhook image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: webhook
          push: false
          tags: c8s-webhook:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
