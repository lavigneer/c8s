# Staging environment overrides
# Moderate resources, single replicas, persistent storage

environment:
  type: staging
  logLevel: info

components:
  apiServer:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  webhook:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

storage:
  type: pvc
  pvc:
    enabled: true
    size: 50Gi
    accessMode: ReadWriteOnce
