{{- if .Values.components.webhook.enabled }}
{{- $certManagerEnabled := .Values.certManager.enabled | default false }}
{{- $caBundle := .Values.components.webhook.tls.caBundle | default "" }}
{{- if and (not $certManagerEnabled) (empty $caBundle) }}
{{- fail "SECURITY ERROR: webhook.tls.caBundle is empty and cert-manager is not enabled.\n\nYou must either:\n1. Enable cert-manager integration:\n   helm install ... -f chart/c8s/values-certmanager.yaml\n\n2. OR manually provide the caBundle:\n   helm install ... --set components.webhook.tls.caBundle='<base64-encoded-ca-cert>'\n\nFor development, generate a self-signed CA:\n  openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes -subj '/CN=c8s-webhook'\n  cat cert.pem | base64 -w 0" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "c8s.fullname" . }}-validating-webhook
  labels:
    {{- include "c8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- if $certManagerEnabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "c8s.namespace" . }}/{{ include "c8s.fullname" . }}-webhook-tls
  {{- end }}
webhooks:
- name: pipeline.c8s.anthropic.com
  clientConfig:
    service:
      name: {{ include "c8s.fullname" . }}-webhook
      namespace: {{ include "c8s.namespace" . }}
      path: "/validate"
    {{- if $certManagerEnabled }}
    caBundle: ""  # Injected by cert-manager via annotation
    {{- else }}
    caBundle: {{ $caBundle | quote }}
    {{- end }}
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["c8s.anthropic.com"]
    apiVersions: ["v1alpha1"]
    resources: ["pipelines", "pipelineconfigs"]
  admissionReviewVersions: ["v1"]
  sideEffects: None
  timeoutSeconds: 5
  failurePolicy: Fail
{{- end }}
