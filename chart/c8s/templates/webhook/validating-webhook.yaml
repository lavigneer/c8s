{{- if .Values.components.webhook.enabled }}
{{- if empty .Values.components.webhook.tls.caBundle }}
{{- fail "SECURITY ERROR: webhook.tls.caBundle is empty. The caBundle must be populated with the actual CA certificate before deployment. This is required for secure webhook communication.\n\nTo fix this, provide the base64-encoded CA certificate:\n  helm install ... --set components.webhook.tls.caBundle='<base64-encoded-ca-cert>'\n\nFor development, generate a self-signed CA:\n  openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes -subj '/CN=c8s-webhook'\n  cat cert.pem | base64 -w 0" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "c8s.fullname" . }}-validating-webhook
  labels:
    {{- include "c8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
webhooks:
- name: pipeline.c8s.anthropic.com
  clientConfig:
    service:
      name: {{ include "c8s.fullname" . }}-webhook
      namespace: {{ include "c8s.namespace" . }}
      path: "/validate"
    caBundle: {{ .Values.components.webhook.tls.caBundle | quote }}
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["c8s.anthropic.com"]
    apiVersions: ["v1alpha1"]
    resources: ["pipelines", "pipelineconfigs"]
  admissionReviewVersions: ["v1"]
  sideEffects: None
  timeoutSeconds: 5
  failurePolicy: Fail
{{- end }}
