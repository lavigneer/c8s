{{- if .Values.components.webhook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c8s.fullname" . }}-webhook
  namespace: {{ include "c8s.namespace" . }}
  labels:
    {{- include "c8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.components.webhook.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      {{- include "c8s.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        {{- include "c8s.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webhook
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "c8s.serviceAccountName" . }}
      containers:
      - name: webhook
        image: "{{ .Values.components.webhook.image.registry }}/{{ .Values.components.webhook.image.repository }}:{{ .Values.components.webhook.image.tag }}"
        imagePullPolicy: {{ .Values.components.webhook.image.pullPolicy }}
        ports:
        - name: https
          containerPort: {{ .Values.components.webhook.port.containerPort }}
          protocol: TCP
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "c8s.fullname" . }}-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: {{ include "c8s.fullname" . }}-config
              key: ENVIRONMENT
        - name: NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: {{ include "c8s.fullname" . }}-config
              key: NAMESPACE
        {{- with .Values.components.webhook.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and (eq .Values.storage.type "s3-compatible") .Values.storage.s3.accessKey }}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "c8s.fullname" . }}-s3-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "c8s.fullname" . }}-s3-secret
              key: AWS_SECRET_ACCESS_KEY
        {{- end }}
        resources:
          {{- toYaml .Values.components.webhook.resources | nindent 10 }}
        {{- if .Values.components.webhook.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.components.webhook.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.components.webhook.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.components.webhook.readinessProbe | nindent 10 }}
        {{- end }}
{{- end }}
