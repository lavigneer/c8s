{{- if and .Values.certManager.enabled (eq .Values.certManager.installDependency true) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "c8s.fullname" . }}-wait-cert-manager
  namespace: {{ include "c8s.namespace" . }}
  labels:
    {{- include "c8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-install
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "c8s.labels" . | nindent 8 }}
        app.kubernetes.io/component: pre-install
    spec:
      serviceAccountName: {{ include "c8s.fullname" . }}-webhook
      restartPolicy: Never
      containers:
      - name: wait-cert-manager
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for cert-manager CRDs to be installed..."

          # Wait up to 5 minutes for cert-manager CRDs
          for i in {1..60}; do
            if kubectl get crd certificates.cert-manager.io >/dev/null 2>&1 && \
               kubectl get crd issuers.cert-manager.io >/dev/null 2>&1; then
              echo "✓ cert-manager CRDs are available"
              exit 0
            fi
            echo "Waiting for cert-manager CRDs... ($((i*5))/300 seconds)"
            sleep 5
          done

          echo "✗ Timeout waiting for cert-manager CRDs"
          exit 1
{{- end }}
