# Default values for C8S Helm chart
# This is a YAML-formatted file declaring variables to be passed into templates
#
# This chart is optimized for local development (used by Tilt).
# For production deployments, customize these values as needed.
#
# Usage:
#   tilt up                                                   # Primary workflow (uses values-dev.yaml)
#   helm install c8s ./chart/c8s                              # Use defaults
#   helm install c8s ./chart/c8s -f values-dev.yaml          # Development
#   helm install c8s ./chart/c8s --set replicaCount.apiServer=3  # Custom values
#
# For production deployment examples, see README.md

# CRD installation
crds:
  # Install Custom Resource Definitions (required for controller to work)
  # Set to false if CRDs are managed separately
  install: true

# Cert-Manager configuration for webhook TLS certificates
# For production deployments, consider enabling cert-manager for automatic TLS certificate management
certManager:
  # Enable cert-manager integration for automatic certificate management
  # When enabled, webhook TLS certificates are automatically provisioned and renewed
  # When disabled, you must provide a caBundle in components.webhook.tls.caBundle
  enabled: false
  # Install cert-manager as a Helm dependency (requires Chart.lock to be generated)
  # Set to true to automatically install cert-manager, or false to use existing installation
  # Usage: helm dependency update ./chart/c8s  (first time only)
  installDependency: false
  # Certificate issuer type: self-signed (dev) or letsencrypt-staging/letsencrypt-prod (prod)
  issuerType: self-signed
  # Email for ACME certificate notifications (required for letsencrypt issuers)
  acmeEmail: "admin@example.com"

# Global settings
global:
  # Kubernetes namespace where C8S will be deployed
  # Valid values: kubernetes namespace names (lowercase, alphanumeric, hyphens, 1-63 chars)
  namespace: c8s-system

# Environment type and logging configuration
environment:
  # Environment type determines default resource limits and replica counts
  # Options: dev (development), staging, production
  # Can be overridden in values-dev.yaml, values-staging.yaml, values-prod.yaml
  type: dev
  # Log level for all components
  # Options: debug, info, warn, error
  logLevel: info

# Components configuration
components:
  # API Server component - REST API for pipeline management
  # Controls the C8S API server deployment
  apiServer:
    enabled: true
    # Container image configuration
    image:
      # Container registry (docker.io, gcr.io, ecr.aws, etc.)
      registry: docker.io
      # Image repository path
      repository: lavigneer/c8s-api-server
      # Image tag/version (use specific versions in production, not 'latest')
      tag: "latest"
      # Image pull policy: Always, IfNotPresent, or Never
      pullPolicy: IfNotPresent
    # Number of pod replicas (1 for dev, 2+ for production)
    # Valid values: 1-5
    replicas: 1
    port:
      containerPort: 8080
      servicePort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

  # Controller component
  controller:
    enabled: true
    image:
      registry: docker.io
      repository: lavigneer/c8s-controller
      tag: "latest"
      pullPolicy: IfNotPresent
    replicas: 1
    port:
      containerPort: 8081
      servicePort: 8081
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

  # Webhook component
  webhook:
    enabled: true
    image:
      registry: docker.io
      repository: lavigneer/c8s-webhook
      tag: "latest"
      pullPolicy: IfNotPresent
    replicas: 1
    port:
      containerPort: 8080
      servicePort: 8080
    # TLS configuration for webhook
    tls:
      # CA certificate for webhook TLS validation (base64-encoded PEM)
      # This certificate is used by the Kubernetes API server to verify the webhook service's certificate
      # IMPORTANT: This must be populated with the actual CA certificate before production deployment
      # To generate a self-signed CA for development:
      #   openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=c8s-webhook"
      #   cat cert.pem | base64 -w 0
      caBundle: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

# Storage configuration for logs and artifacts
# Choose one of: local (ephemeral), pvc (persistent volume), or s3-compatible (object storage)
storage:
  # Storage type: local, pvc, or s3-compatible
  # - local: Ephemeral storage (data lost when pod restarts) - dev only
  # - pvc: Kubernetes PersistentVolumeClaim (persistent, requires storage class)
  # - s3-compatible: S3-compatible object storage (MinIO, AWS S3, etc.)
  type: local

  # S3-compatible storage configuration (used when type: s3-compatible)
  s3:
    enabled: false
    # S3 endpoint URL (e.g., minio.c8s-system.svc.cluster.local:9000 or s3.amazonaws.com)
    endpoint: minio.c8s-system.svc.cluster.local:9000
    # S3 bucket name for storing logs and artifacts
    bucket: c8s-logs
    # AWS region (default: us-east-1)
    region: us-east-1
    # Use HTTPS for S3 connection (set to true for production)
    useSSL: false
    # Skip SSL certificate verification (dev only, DO NOT use in production)
    insecureSkipVerify: false
    # S3 access credentials (provide via --set or Kubernetes Secret)
    # Example: --set storage.s3.accessKey=AKIA... --set storage.s3.secretKey=...
    accessKey: ""
    secretKey: ""

  # PersistentVolumeClaim configuration (used when type: pvc)
  pvc:
    enabled: false
    # Kubernetes StorageClass name (leave empty to use default)
    # List available classes: kubectl get storageclass
    storageClass: ""
    # PVC size (e.g., 10Gi, 100Gi, 1Ti)
    size: 10Gi
    # Access mode: ReadWriteOnce, ReadWriteMany, or ReadOnlyMany
    # Most common: ReadWriteOnce (single node read/write)
    accessMode: ReadWriteOnce

# Service account configuration
serviceAccount:
  create: true
  name: c8s-controller

# RBAC configuration
rbac:
  create: true

# Post-install hook settings
postInstallHook:
  enabled: true
  timeout: 300  # seconds to wait for components to become ready

# Labels and annotations
labels:
  app.kubernetes.io/name: c8s
  app.kubernetes.io/instance: c8s
  app.kubernetes.io/version: "0.1.0"
  app.kubernetes.io/component: pipeline-orchestration

annotations:
  description: "C8S - Continuous Integration Stack"
