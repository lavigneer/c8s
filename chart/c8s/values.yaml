# Default values for C8S Helm chart
# This is a YAML-formatted file declaring variables to be passed into templates

# Global settings
global:
  # Kubernetes namespace where C8S will be deployed
  namespace: c8s-system

# Environment type (dev/staging/production)
environment:
  type: dev  # Can be overridden in values-dev.yaml, values-staging.yaml, values-prod.yaml
  logLevel: info

# Components configuration
components:
  # API Server component
  apiServer:
    enabled: true
    image:
      registry: docker.io
      repository: anthropics/c8s-api-server
      tag: "latest"
      pullPolicy: IfNotPresent
    replicas: 1
    port:
      containerPort: 8080
      servicePort: 8080
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

  # Controller component
  controller:
    enabled: true
    image:
      registry: docker.io
      repository: anthropics/c8s-controller
      tag: "latest"
      pullPolicy: IfNotPresent
    replicas: 1
    port:
      containerPort: 8081
      servicePort: 8081
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

  # Webhook component
  webhook:
    enabled: true
    image:
      registry: docker.io
      repository: anthropics/c8s-webhook
      tag: "latest"
      pullPolicy: IfNotPresent
    replicas: 1
    port:
      containerPort: 8443
      servicePort: 443
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

  # Frontend component
  frontend:
    enabled: true
    image:
      registry: docker.io
      repository: anthropics/c8s-frontend
      tag: "latest"
      pullPolicy: IfNotPresent
    replicas: 1
    port:
      containerPort: 3000
      servicePort: 80
    service:
      type: LoadBalancer  # Can be NodePort for local clusters
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env: []

# Storage configuration
storage:
  # Type of storage: s3-compatible, pvc, or local
  type: local
  
  # S3-compatible storage configuration (used if type: s3-compatible)
  s3:
    enabled: false
    endpoint: minio.c8s-system.svc.cluster.local:9000
    bucket: c8s-logs
    region: us-east-1
    useSSL: false
    insecureSkipVerify: false
    # accessKey and secretKey should be provided via --set or secret reference
    accessKey: ""
    secretKey: ""
  
  # PersistentVolumeClaim configuration (used if type: pvc)
  pvc:
    enabled: false
    storageClass: ""  # Use default if empty
    size: 10Gi
    accessMode: ReadWriteOnce

# Service account configuration
serviceAccount:
  create: true
  name: c8s-controller

# RBAC configuration
rbac:
  create: true

# Post-install hook settings
postInstallHook:
  enabled: true
  timeout: 300  # seconds to wait for components to become ready

# Labels and annotations
labels:
  app.kubernetes.io/name: c8s
  app.kubernetes.io/instance: c8s
  app.kubernetes.io/version: "0.1.0"
  app.kubernetes.io/component: pipeline-orchestration

annotations:
  description: "C8S - Continuous Integration Stack"
