# Cert-Manager Configuration for C8S
# This file demonstrates how to use cert-manager to automatically provision
# and manage webhook TLS certificates.
#
# Two installation options:
#
# Option 1: Install cert-manager automatically (recommended)
#   helm dependency update ./chart/c8s
#   helm install c8s ./chart/c8s -f chart/c8s/values-certmanager.yaml
#
# Option 2: Use existing cert-manager installation
#   helm install cert-manager jetstack/cert-manager \
#     --namespace cert-manager \
#     --create-namespace \
#     --set installCRDs=true
#   helm install c8s ./chart/c8s -f chart/c8s/values-certmanager.yaml \
#     --set certManager.installDependency=false

# Enable cert-manager integration
certManager:
  enabled: true
  # Automatically install cert-manager as a Helm dependency
  # Set to false if cert-manager is already installed in your cluster
  installDependency: true
  # Certificate issuer: self-signed (dev) or letsencrypt (prod)
  issuerType: self-signed  # or "letsencrypt-staging" or "letsencrypt-prod"
  # Email for LetsEncrypt notifications (only for letsencrypt issuers)
  acmeEmail: "admin@example.com"

components:
  webhook:
    enabled: true
    # TLS certificate configuration
    tls:
      # When using cert-manager, caBundle is injected automatically
      # Leave empty - cert-manager will populate this
      caBundle: ""
      # Enable cert-manager certificate provisioning
      certManager:
        enabled: true
        # Self-signed issuer for development
        issuerName: c8s-webhook-selfsigned
        issuerKind: Issuer
        # Certificate validity duration
        duration: 2160h  # 90 days
        renewBefore: 720h  # 30 days before expiry
