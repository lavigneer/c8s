# Development environment overrides
# Minimal resources, single replicas, local storage

certManager:
  enabled: false

environment:
  type: dev
  logLevel: debug

components:
  apiServer:
    replicas: 1
    readinessProbe: null  # Disable in dev until endpoint is implemented
    livenessProbe: null
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  controller:
    replicas: 1
    readinessProbe: null  # Disable in dev until endpoint is implemented
    livenessProbe: null
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  webhook:
    replicas: 1
    readinessProbe: null  # Disable in dev until endpoint is implemented
    livenessProbe: null
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  frontend:
    replicas: 1
    service:
      type: NodePort  # Use NodePort for local development
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

storage:
  type: local
