# Production environment overrides
# High resources, multiple replicas, S3 storage for HA

environment:
  type: production
  logLevel: warn

components:
  apiServer:
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

  controller:
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

  webhook:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

  frontend:
    replicas: 2
    service:
      type: LoadBalancer
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

storage:
  type: s3-compatible
  s3:
    enabled: true
    endpoint: s3.amazonaws.com
    bucket: c8s-logs-prod
    region: us-west-2
    useSSL: true
    insecureSkipVerify: false
    # accessKey and secretKey should be provided via --set or secret reference in production
    accessKey: ""
    secretKey: ""
