# Tilt-specific values overrides for C8S
# Cert-manager is installed as a separate Helm release (installed first by Tilt)
# so we can enable webhook with TLS certificates

certManager:
  enabled: true
  installDependency: false  # cert-manager installed separately by Tilt
  issuerType: self-signed

environment:
  type: dev
  logLevel: debug

components:
  apiServer:
    replicas: 1
    env:
      - name: JWT_SECRET
        value: "dev-secret-key-change-in-production"
      # S3 Configuration for log retrieval
      # Note: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY come from the s3-secret
      - name: S3_BUCKET
        value: "c8s-logs"
      - name: S3_ENDPOINT
        value: "http://minio.c8s-system.svc.cluster.local:9000"
      - name: S3_REGION
        value: "us-east-1"
      - name: S3_USE_PATH_STYLE
        value: "true"

  controller:
    replicas: 1
    env:
      # S3 Configuration for log persistence
      # Note: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY come from the s3-secret
      - name: S3_BUCKET
        value: "c8s-logs"
      - name: S3_ENDPOINT
        value: "http://minio.c8s-system.svc.cluster.local:9000"
      - name: S3_REGION
        value: "us-east-1"
      - name: S3_USE_PATH_STYLE
        value: "true"

  # Webhook enabled with TLS certificates (cert-manager is available)
  webhook:
    enabled: true
    replicas: 1
    tls:
      certManager:
        enabled: true
        issuerName: c8s-webhook-selfsigned
        issuerKind: Issuer
        duration: 2160h  # 90 days
        renewBefore: 720h  # 30 days before expiry

storage:
  type: s3-compatible
  s3:
    enabled: true
    endpoint: "http://minio.c8s-system.svc.cluster.local:9000"
    bucket: "c8s-logs"
    region: "us-east-1"
    useSSL: false
    accessKey: "minioadmin"
    secretKey: "minioadmin"
