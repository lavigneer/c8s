# Tilt-specific values for C8S Helm chart
# This file contains overrides optimized for local development with Tilt

global:
  namespace: c8s-system
  environment: dev
  logLevel: debug

images:
  # Use local images built by Tilt (no registry needed)
  registry: ""
  pullPolicy: Never  # Critical: Always use local images built by Tilt

components:
  apiServer:
    replicas: 1
    image:
      repository: org/c8s-api-server
      tag: latest
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 512Mi

  controller:
    replicas: 1
    image:
      repository: org/c8s-controller
      tag: latest
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 512Mi

  webhook:
    replicas: 1
    image:
      repository: org/c8s-webhook
      tag: latest
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi

  frontend:
    replicas: 1
    image:
      repository: org/c8s-frontend
      tag: latest
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Use NodePort for local access (no LoadBalancer)
    serviceType: NodePort

storage:
  # Use local storage for development (no S3/PVC)
  type: local

postInstall:
  # Longer timeout for local development (slower hardware)
  timeout: 600
  enabled: true

# Disable autoscaling in development
autoscaling:
  enabled: false
