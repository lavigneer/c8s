# Tilt-specific values overrides for C8S development
# These override values-dev.yaml when using Tilt

environment:
  type: dev
  logLevel: debug

components:
  apiServer:
    replicas: 1

  controller:
    replicas: 1

  # Webhook is disabled in Tilt for development
  # The webhook requires TLS certificates (via cert-manager or manual caBundle)
  # which are not needed for local development testing.
  # To enable webhook in Tilt:
  #   1. Install cert-manager: helm install cert-manager jetstack/cert-manager ...
  #   2. Deploy with: helm install c8s ./chart/c8s -f values-certmanager.yaml
  # OR provide a caBundle: --set components.webhook.tls.caBundle=<base64-cert>
  webhook:
    enabled: false
    replicas: 1

  frontend:
    replicas: 1
    service:
      type: NodePort  # Use NodePort for local Tilt development

storage:
  type: local
