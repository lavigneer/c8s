# Tilt-specific values overrides for C8S development
# These override values-dev.yaml when using Tilt

# Tilt Development Configuration for C8S
# Cert-manager is automatically installed as part of Tilt deployment
# Webhook TLS certificates are automatically generated via cert-manager

certManager:
  enabled: true
  installDependency: true  # cert-manager installed as Helm dependency
  issuerType: self-signed

environment:
  type: dev
  logLevel: debug

components:
  apiServer:
    replicas: 1

  controller:
    replicas: 1

  # Webhook enabled with automatic self-signed TLS certificates
  webhook:
    enabled: true
    replicas: 1
    tls:
      certManager:
        enabled: true
        issuerName: c8s-webhook-selfsigned
        issuerKind: Issuer
        duration: 2160h  # 90 days
        renewBefore: 720h  # 30 days before expiry

  frontend:
    replicas: 1
    service:
      type: NodePort  # Use NodePort for local Tilt development

storage:
  type: local
