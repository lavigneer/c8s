# Tilt-specific values overrides for C8S
# Cert-manager is installed as a separate Helm release (installed first by Tilt)
# so we can enable webhook with TLS certificates

certManager:
  enabled: true
  installDependency: false  # cert-manager installed separately by Tilt
  issuerType: self-signed

environment:
  type: dev
  logLevel: debug

components:
  apiServer:
    replicas: 1

  controller:
    replicas: 1

  # Webhook disabled for now due to cert-manager webhook TLS issues in dev
  # Can be re-enabled once cert-manager is fully initialized
  webhook:
    enabled: false

storage:
  type: local
