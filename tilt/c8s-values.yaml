# Tilt-specific values overrides for C8S
# Cert-manager is installed as a separate Helm release (installed first by Tilt)
# so we can enable webhook with TLS certificates

certManager:
  enabled: true
  installDependency: false  # cert-manager installed separately by Tilt
  issuerType: self-signed

environment:
  type: dev
  logLevel: debug

components:
  apiServer:
    replicas: 1
    env:
      - name: JWT_SECRET
        value: "dev-secret-key-change-in-production"

  controller:
    replicas: 1

  # Webhook enabled with TLS certificates (cert-manager is available)
  webhook:
    enabled: true
    replicas: 1
    tls:
      certManager:
        enabled: true
        issuerName: c8s-webhook-selfsigned
        issuerKind: Issuer
        duration: 2160h  # 90 days
        renewBefore: 720h  # 30 days before expiry

storage:
  type: local
