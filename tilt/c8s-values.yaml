# Tilt-specific values overrides for C8S development
# These override values-dev.yaml when using Tilt

# Enable cert-manager for automatic webhook TLS certificates in development
# Requires: helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true
certManager:
  enabled: true
  issuerType: self-signed

environment:
  type: dev
  logLevel: debug

components:
  apiServer:
    replicas: 1

  controller:
    replicas: 1

  # Webhook is enabled with automatic self-signed certificates via cert-manager
  webhook:
    enabled: true
    replicas: 1
    tls:
      certManager:
        enabled: true
        issuerName: c8s-webhook-selfsigned
        issuerKind: Issuer
        duration: 2160h  # 90 days
        renewBefore: 720h  # 30 days before expiry

  frontend:
    replicas: 1
    service:
      type: NodePort  # Use NodePort for local Tilt development

storage:
  type: local
