{{define "partials/projects_list"}}
<!-- Projects List Section -->
<div class="mb-6 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/30 overflow-hidden">
  <div class="border-b border-gray-200 dark:border-gray-700 px-4 py-3">
    <h2 class="text-base font-semibold text-gray-900 dark:text-white">Projects</h2>
  </div>
  <div class="grid gap-3 p-3 grid-cols-3">
    {{if .Projects}}
      {{range .Projects}}
      <a href="/dashboard/projects/{{.ID}}"
         class="group rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/20 p-3 hover:bg-gray-100 dark:hover:bg-gray-700/40 transition-colors">
        <div class="space-y-2">
          <!-- Header with icon and status -->
          <div class="flex items-start justify-between gap-2">
            <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 flex-shrink-0">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
                <path d="M9 18c-4.51 2-5-2-7-2" />
              </svg>
            </div>
            <div class="h-2 w-2 rounded-full bg-green-500 flex-shrink-0 mt-0.5"></div>
          </div>

          <!-- Project info -->
          <div>
            <h3 class="text-sm font-semibold text-gray-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors line-clamp-1">{{.Name}}</h3>
            <p class="text-xs text-gray-600 dark:text-gray-400 line-clamp-1">{{.Description}}</p>
          </div>

          <!-- Footer with last build info -->
          <div class="text-xs text-gray-600 dark:text-gray-400">
            <span>Last build: {{if .LastRunAt}}{{.LastRunAt.Format "2 Jan 15:04"}}{{else}}—{{end}}</span>
            {{if gt .RunCount 0}}
            <span class="rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 px-1.5 py-0.5 text-xs font-medium ml-1">
              {{.RunCount}} active
            </span>
            {{end}}
          </div>
        </div>
      </a>
      {{end}}
    {{else}}
    <div class="col-span-full p-6 text-center">
      <p class="text-sm text-gray-600 dark:text-gray-400">No projects yet</p>
    </div>
    {{end}}
  </div>
</div>
{{end}}
