{{define "partials/filter_panel"}}
<form id="filter-form" class="p-4">
    <!-- Compact Search Bar with More Filters Toggle -->
    <div class="flex gap-3 items-end">
        <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Search</label>
            <input type="text"
                   name="search"
                   placeholder="Commit SHA, author..."
                   class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   hx-get="/api/projects/{{.ProjectID}}/runs"
                   hx-target="#pipeline-rows"
                   hx-trigger="keyup changed delay:500ms"
                   hx-include="#filter-form [name]">
        </div>
        <button type="button"
                class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-900 dark:text-white font-medium rounded-lg transition"
                onclick="toggleAdvancedFilters()"
                id="more-filters-btn">
            More Filters
        </button>
    </div>

    <!-- Advanced Filters (Hidden by Default) -->
    <div id="advanced-filters" class="hidden mt-4 p-4 bg-gray-50 dark:bg-gray-900/50 rounded-lg border border-gray-200 dark:border-gray-700">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Branch Filter -->
            <div class="filter-group">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Branch</label>
                <select name="branch"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                        hx-get="/api/projects/{{.ProjectID}}/runs"
                        hx-target="#pipeline-rows"
                        hx-trigger="change"
                        hx-include="#filter-form [name]">
                    <option value="">All Branches</option>
                    {{range .Branches}}
                        <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>

            <!-- Status Filter -->
            <div class="filter-group">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Status</label>
                <select name="status"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                        hx-get="/api/projects/{{.ProjectID}}/runs"
                        hx-target="#pipeline-rows"
                        hx-trigger="change"
                        hx-include="#filter-form [name]">
                    <option value="">All Statuses</option>
                    <option value="Succeeded">✓ Succeeded</option>
                    <option value="Failed">✗ Failed</option>
                    <option value="Running">⏳ Running</option>
                    <option value="Pending">⏸ Pending</option>
                    <option value="Cancelled">⊘ Cancelled</option>
                </select>
            </div>

            <!-- From Date -->
            <div class="filter-group">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">From Date</label>
                <input type="date"
                       name="from_date"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                       hx-get="/api/projects/{{.ProjectID}}/runs"
                       hx-target="#pipeline-rows"
                       hx-trigger="change"
                       hx-include="#filter-form [name]">
            </div>

            <!-- To Date -->
            <div class="filter-group">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">To Date</label>
                <input type="date"
                       name="to_date"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                       hx-get="/api/projects/{{.ProjectID}}/runs"
                       hx-target="#pipeline-rows"
                       hx-trigger="change"
                       hx-include="#filter-form [name]">
            </div>
        </div>
    </div>
</form>

<!-- Quick Filters & Controls -->
<div class="px-4 pb-4 flex flex-wrap gap-3 items-center justify-between">
    <div class="flex flex-wrap gap-2">
        <button type="button"
                class="px-3 py-1 bg-green-600 dark:bg-green-700 hover:bg-green-700 dark:hover:bg-green-600 text-white text-xs font-medium rounded-full transition"
                onclick="applyQuickFilter('status', 'Succeeded')">
            ✓ Succeeded
        </button>
        <button type="button"
                class="px-3 py-1 bg-red-600 dark:bg-red-700 hover:bg-red-700 dark:hover:bg-red-600 text-white text-xs font-medium rounded-full transition"
                onclick="applyQuickFilter('status', 'Failed')">
            ✗ Failed
        </button>
        <button type="button"
                class="px-3 py-1 bg-yellow-600 dark:bg-yellow-700 hover:bg-yellow-700 dark:hover:bg-yellow-600 text-white text-xs font-medium rounded-full transition"
                onclick="applyQuickFilter('status', 'Running')">
            ⏳ Running
        </button>
        <button type="button"
                class="px-3 py-1 bg-blue-600 dark:bg-blue-700 hover:bg-blue-700 dark:hover:bg-blue-600 text-white text-xs font-medium rounded-full transition"
                onclick="clearFiltersCompletely()">
            Clear All
        </button>
    </div>

    <div class="flex gap-2 items-center">
        <div class="text-sm text-gray-600 dark:text-gray-400 flex items-center">
            Showing <span id="result-count" class="font-semibold mx-1">0</span> results
            <span id="filter-loading" class="ml-3 text-blue-600 dark:text-blue-400 hidden">
                <span class="inline-block animate-spin">⟳</span> Filtering...
            </span>
        </div>
        <div class="flex gap-1 ml-4 pl-4 border-l border-gray-300 dark:border-gray-700">
            <button type="button"
                    class="px-3 py-2 bg-blue-600 dark:bg-blue-700 hover:bg-blue-700 dark:hover:bg-blue-600 text-white text-xs font-semibold rounded transition"
                    onclick="exportRuns('json')"
                    title="Export runs as JSON">
                ⬇ JSON
            </button>
            <button type="button"
                    class="px-3 py-2 bg-green-600 dark:bg-green-700 hover:bg-green-700 dark:hover:bg-green-600 text-white text-xs font-semibold rounded transition"
                    onclick="exportRuns('csv')"
                    title="Export runs as CSV">
                ⬇ CSV
            </button>
        </div>
    </div>
</div>

<script>
// Toggle advanced filters visibility
function toggleAdvancedFilters() {
    const advancedFilters = document.getElementById('advanced-filters');
    const moreFiltersBtn = document.getElementById('more-filters-btn');

    advancedFilters.classList.toggle('hidden');

    // Update button text and styling
    if (advancedFilters.classList.contains('hidden')) {
        moreFiltersBtn.textContent = 'More Filters';
        moreFiltersBtn.classList.remove('bg-blue-600', 'text-white');
        moreFiltersBtn.classList.add('bg-gray-200', 'text-gray-900', 'dark:bg-gray-700', 'dark:text-white');
    } else {
        moreFiltersBtn.textContent = 'Hide Filters';
        moreFiltersBtn.classList.remove('bg-gray-200', 'text-gray-900');
        moreFiltersBtn.classList.add('bg-blue-600', 'text-white');
    }
}

// Initialize filters from URL on page load
function initializeFiltersFromURL() {
    const params = new URLSearchParams(window.location.search);
    const hasAdvancedFilters = params.has('branch') || params.has('status') ||
                               params.has('from_date') || params.has('to_date');

    // Set form values from URL params
    const search = params.get('search');
    if (search) document.querySelector('input[name="search"]').value = search;

    const branch = params.get('branch');
    if (branch) document.querySelector('select[name="branch"]').value = branch;

    const status = params.get('status');
    if (status) document.querySelector('select[name="status"]').value = status;

    const fromDate = params.get('from_date');
    if (fromDate) document.querySelector('input[name="from_date"]').value = fromDate;

    const toDate = params.get('to_date');
    if (toDate) document.querySelector('input[name="to_date"]').value = toDate;

    // Auto-expand advanced filters if URL has any advanced filter params
    if (hasAdvancedFilters) {
        toggleAdvancedFilters();
    }
}

// Update URL when filters change
function updateURLWithFilters() {
    const form = document.getElementById('filter-form');
    const formData = new FormData(form);
    const params = new URLSearchParams();

    for (let [key, value] of formData.entries()) {
        if (value) {
            params.append(key, value);
        }
    }

    const newURL = params.toString()
        ? `${window.location.pathname}?${params.toString()}`
        : window.location.pathname;

    window.history.replaceState({}, '', newURL);
}

function clearFilters() {
    // Clear all filter inputs
    document.getElementById('filter-form').reset();

    // Update URL to remove all filters
    window.history.replaceState({}, '', window.location.pathname);

    // Trigger filter update with empty filters
    htmx.ajax('GET', '/api/projects/{{.ProjectID}}/runs', '#pipeline-rows');
}

// Apply a quick filter
function applyQuickFilter(filterName, filterValue) {
    const form = document.getElementById('filter-form');

    // Set the filter value
    const input = form.querySelector(`[name="${filterName}"]`);
    if (input) {
        input.value = filterValue;
        updateURLWithFilters();

        // Trigger HTMX filter update
        const formData = new FormData(form);
        const params = new URLSearchParams();

        for (let [key, value] of formData.entries()) {
            if (value) {
                params.append(key, value);
            }
        }

        const filterUrl = '/api/projects/{{.ProjectID}}/runs?' + params.toString();
        htmx.ajax('GET', filterUrl, '#pipeline-rows');
    }
}

// Clear all filters completely
function clearFiltersCompletely() {
    clearFilters();
}

// Export pipeline runs in specified format
function exportRuns(format) {
    const params = new URLSearchParams(window.location.search);
    params.set('format', format);

    const exportUrl = '/api/exports/runs?' + params.toString();
    window.location.href = exportUrl;
}

// Show/hide loading indicator on filter requests
document.addEventListener('htmx:sendingStart', function(event) {
    const filterLoading = document.getElementById('filter-loading');
    if (filterLoading) {
        filterLoading.classList.remove('hidden');
    }
});

document.addEventListener('htmx:sendingEnd', function(event) {
    const filterLoading = document.getElementById('filter-loading');
    if (filterLoading) {
        filterLoading.classList.add('hidden');
    }
});

// Add event listeners to update URL when filters change
document.addEventListener('DOMContentLoaded', function() {
    initializeFiltersFromURL();

    const filterForm = document.getElementById('filter-form');
    filterForm.addEventListener('change', updateURLWithFilters);
    filterForm.addEventListener('keyup', updateURLWithFilters);
});

// Update result count when filters change
document.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail.target.id === 'pipeline-rows') {
        const count = event.detail.target.querySelectorAll('[id^="pipeline-"]').length;
        document.getElementById('result-count').textContent = count;
    }
});

// Handle HTMX errors with user-friendly messages
document.addEventListener('htmx:responseError', function(event) {
    console.error('Filter error:', event.detail.xhr.status, event.detail.xhr.statusText);
    const resultCount = document.getElementById('result-count');
    if (resultCount) {
        resultCount.textContent = '0';
    }
});
</script>
{{end}}
