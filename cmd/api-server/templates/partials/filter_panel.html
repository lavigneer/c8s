{{define "partials/filter_panel"}}
<div class="filter-panel bg-white rounded-lg shadow-md p-6 mb-8">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Filters</h3>

    <form class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4" id="filter-form">
        <!-- Search Input -->
        <div class="filter-group">
            <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
            <input type="text"
                   name="search"
                   placeholder="Commit SHA, author..."
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                   hx-get="/api/projects/{{.ProjectID}}/runs"
                   hx-target="#pipeline-rows"
                   hx-trigger="keyup changed delay:500ms"
                   hx-include="#filter-form [name]">
        </div>

        <!-- Branch Filter -->
        <div class="filter-group">
            <label class="block text-sm font-medium text-gray-700 mb-2">Branch</label>
            <select name="branch"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    hx-get="/api/projects/{{.ProjectID}}/runs"
                    hx-target="#pipeline-rows"
                    hx-trigger="change"
                    hx-include="#filter-form [name]">
                <option value="">All Branches</option>
                {{range .Branches}}
                    <option value="{{.}}">{{.}}</option>
                {{end}}
            </select>
        </div>

        <!-- Status Filter -->
        <div class="filter-group">
            <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
            <select name="status"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    hx-get="/api/projects/{{.ProjectID}}/runs"
                    hx-target="#pipeline-rows"
                    hx-trigger="change"
                    hx-include="#filter-form [name]">
                <option value="">All Statuses</option>
                <option value="Succeeded">✓ Succeeded</option>
                <option value="Failed">✗ Failed</option>
                <option value="Running">⏳ Running</option>
                <option value="Pending">⏸ Pending</option>
                <option value="Cancelled">⊘ Cancelled</option>
            </select>
        </div>

        <!-- From Date -->
        <div class="filter-group">
            <label class="block text-sm font-medium text-gray-700 mb-2">From Date</label>
            <input type="date"
                   name="from_date"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                   hx-get="/api/projects/{{.ProjectID}}/runs"
                   hx-target="#pipeline-rows"
                   hx-trigger="change"
                   hx-include="#filter-form [name]">
        </div>

        <!-- To Date -->
        <div class="filter-group">
            <label class="block text-sm font-medium text-gray-700 mb-2">To Date</label>
            <input type="date"
                   name="to_date"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                   hx-get="/api/projects/{{.ProjectID}}/runs"
                   hx-target="#pipeline-rows"
                   hx-trigger="change"
                   hx-include="#filter-form [name]">
        </div>
    </form>

    <!-- Clear Button -->
    <div class="mt-4 flex gap-2">
        <button type="button"
                class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-900 font-semibold rounded-lg transition"
                onclick="clearFilters()">
            Clear Filters
        </button>
        <div class="text-sm text-gray-600 flex items-center">
            Showing <span id="result-count" class="font-semibold mx-1">0</span> results
        </div>
    </div>
</div>

<script>
// Initialize filters from URL on page load
function initializeFiltersFromURL() {
    const params = new URLSearchParams(window.location.search);

    // Set form values from URL params
    const search = params.get('search');
    if (search) document.querySelector('input[name="search"]').value = search;

    const branch = params.get('branch');
    if (branch) document.querySelector('select[name="branch"]').value = branch;

    const status = params.get('status');
    if (status) document.querySelector('select[name="status"]').value = status;

    const fromDate = params.get('from_date');
    if (fromDate) document.querySelector('input[name="from_date"]').value = fromDate;

    const toDate = params.get('to_date');
    if (toDate) document.querySelector('input[name="to_date"]').value = toDate;
}

// Update URL when filters change
function updateURLWithFilters() {
    const form = document.getElementById('filter-form');
    const formData = new FormData(form);
    const params = new URLSearchParams();

    for (let [key, value] of formData.entries()) {
        if (value) {
            params.append(key, value);
        }
    }

    const newURL = params.toString()
        ? `${window.location.pathname}?${params.toString()}`
        : window.location.pathname;

    window.history.replaceState({}, '', newURL);
}

function clearFilters() {
    // Clear all filter inputs
    document.getElementById('filter-form').reset();

    // Update URL to remove all filters
    window.history.replaceState({}, '', window.location.pathname);

    // Trigger filter update with empty filters
    htmx.ajax('GET', '/api/projects/{{.ProjectID}}/runs', '#pipeline-rows');
}

// Add event listeners to update URL when filters change
document.addEventListener('DOMContentLoaded', function() {
    initializeFiltersFromURL();

    const filterForm = document.getElementById('filter-form');
    filterForm.addEventListener('change', updateURLWithFilters);
    filterForm.addEventListener('keyup', updateURLWithFilters);
});

// Update result count when filters change
document.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail.target.id === 'pipeline-rows') {
        const count = event.detail.target.querySelectorAll('[id^="pipeline-"]').length;
        document.getElementById('result-count').textContent = count;
    }
});
</script>
{{end}}
