{{define "partials/builds_overview"}}
<!-- Builds Overview Stats Cards -->
<div class="grid gap-4 md:grid-cols-4 mb-6">
  <!-- Total Builds Card -->
  <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/50 p-4">
    <div class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Builds</div>
    <div class="mt-3 flex items-end justify-between gap-2">
      <div class="text-3xl font-semibold text-gray-900 dark:text-white">{{.TotalRuns}}</div>
      <div class="text-sm text-green-600 dark:text-green-400 font-medium">+12%</div>
    </div>
  </div>

  <!-- Success Rate Card -->
  <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/50 p-4">
    <div class="text-sm font-medium text-gray-500 dark:text-gray-400">Success Rate</div>
    <div class="mt-3 flex items-end justify-between gap-2">
      <div class="text-3xl font-semibold text-gray-900 dark:text-white">{{printf "%.1f" .SuccessRate}}%</div>
      <div class="text-sm text-green-600 dark:text-green-400 font-medium">+2.1%</div>
    </div>
  </div>

  <!-- Avg Duration Card -->
  <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/50 p-4">
    <div class="text-sm font-medium text-gray-500 dark:text-gray-400">Avg Duration</div>
    <div class="mt-3 flex items-end justify-between gap-2">
      <div class="text-3xl font-semibold text-gray-900 dark:text-white">—</div>
      <div class="text-sm text-green-600 dark:text-green-400 font-medium">—</div>
    </div>
  </div>

  <!-- Failed Builds Card -->
  <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/50 p-4">
    <div class="text-sm font-medium text-gray-500 dark:text-gray-400">Failed</div>
    <div class="mt-3 flex items-end justify-between gap-2">
      <div class="text-3xl font-semibold text-gray-900 dark:text-white">{{.FailedCount}}</div>
      <div class="text-sm text-green-600 dark:text-green-400 font-medium">-3</div>
    </div>
  </div>
</div>
{{end}}
