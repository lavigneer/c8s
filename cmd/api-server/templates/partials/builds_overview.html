{{define "partials/builds_overview"}}
<!-- Builds Overview Stats Cards -->
<div class="grid gap-3 md:grid-cols-4 mb-6">
  <!-- Total Builds Card -->
  <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/30 p-3">
    <div class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide">Total Builds</div>
    <div class="mt-2 flex items-end justify-between gap-2">
      <div class="text-2xl font-bold text-gray-900 dark:text-white">{{.TotalRuns}}</div>
      <div class="text-xs text-green-600 dark:text-green-400 font-semibold">+12%</div>
    </div>
  </div>

  <!-- Success Rate Card -->
  <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/30 p-3">
    <div class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide">Success Rate</div>
    <div class="mt-2 flex items-end justify-between gap-2">
      <div class="text-2xl font-bold text-gray-900 dark:text-white">{{printf "%.1f" .SuccessRate}}%</div>
      <div class="text-xs text-green-600 dark:text-green-400 font-semibold">+2.1%</div>
    </div>
  </div>

  <!-- Avg Duration Card -->
  <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/30 p-3">
    <div class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide">Avg Duration</div>
    <div class="mt-2 flex items-end justify-between gap-2">
      <div class="text-2xl font-bold text-gray-900 dark:text-white">—</div>
      <div class="text-xs text-green-600 dark:text-green-400 font-semibold">—</div>
    </div>
  </div>

  <!-- Failed Builds Card -->
  <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/30 p-3">
    <div class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide">Failed</div>
    <div class="mt-2 flex items-end justify-between gap-2">
      <div class="text-2xl font-bold text-gray-900 dark:text-white">{{.FailedCount}}</div>
      <div class="text-xs text-green-600 dark:text-green-400 font-semibold">-3</div>
    </div>
  </div>
</div>
{{end}}
