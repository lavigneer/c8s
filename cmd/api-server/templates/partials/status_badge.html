{{define "partials/status_badge"}}
{{if eq .Status "Running"}}
    <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs text-white bg-blue-500">
        <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        Running
    </span>
{{else if eq .Status "Succeeded"}}
    <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs text-white bg-green-500">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12" />
        </svg>
        Succeeded
    </span>
{{else if eq .Status "Failed"}}
    <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs text-white bg-red-500">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        Failed
    </span>
{{else if eq .Status "Pending"}}
    <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs text-gray-700 dark:text-gray-200 bg-gray-200 dark:bg-gray-700">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
        </svg>
        Pending
    </span>
{{else if eq .Status "Cancelled"}}
    <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs text-white bg-red-500">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="8" y1="12" x2="16" y2="12" />
        </svg>
        Cancelled
    </span>
{{else}}
    <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs text-gray-700 dark:text-gray-200 bg-gray-200 dark:bg-gray-700">
        {{.Status}}
    </span>
{{end}}
{{end}}
