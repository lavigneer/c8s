{{define "partials/nav"}}
<header class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
    <div class="container mx-auto flex items-center justify-between p-4 max-w-7xl">
        <div class="flex items-center gap-3">
            <!-- Clock Icon -->
            {{template "icons/clock" dict "Class" "w-8 h-8 text-gray-900 dark:text-white"}}
            <div>
                <h1 class="text-xl font-semibold text-gray-900 dark:text-white">CI Dashboard</h1>
                <p class="text-xs text-gray-600 dark:text-gray-400">Build Pipeline Monitor</p>
            </div>
        </div>

        <button data-theme-toggle class="rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-800 p-2 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" aria-label="Toggle theme">
            <!-- Sun Icon (shown in dark mode) -->
            {{template "icons/sun" dict "Class" "w-5 h-5 text-gray-900 dark:text-white hidden dark:block"}}
            <!-- Moon Icon (shown in light mode) -->
            {{template "icons/moon" dict "Class" "w-5 h-5 text-gray-900 dark:hidden"}}
        </button>
    </div>
</header>
{{end}}
