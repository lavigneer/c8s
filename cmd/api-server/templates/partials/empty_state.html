{{define "partials/empty_state"}}
<div class="flex flex-col items-center justify-center py-12">
    <div class="mb-4 text-gray-400 dark:text-gray-500">
        {{template "icons/inbox" dict "Class" "w-16 h-16"}}
    </div>
    <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">{{.Title}}</h3>
    <p class="text-gray-600 dark:text-gray-400 mb-6 text-center max-w-sm">{{.Message}}</p>
    {{if .ActionText}}
        <a href="{{.ActionURL}}" class="inline-block px-6 py-2 bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-600 text-white font-semibold rounded-lg transition-colors duration-200">
            {{.ActionText}}
        </a>
    {{end}}
</div>
{{end}}
