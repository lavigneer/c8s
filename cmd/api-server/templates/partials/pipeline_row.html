{{define "partials/pipeline_row"}}
<div class="hover:bg-gray-50 dark:hover:bg-gray-700/20 transition p-4 border-b border-gray-200 dark:border-gray-700" id="pipeline-{{.ID}}">
    <div class="flex flex-col gap-3">
        <!-- First row: Project/Branch with status badge and View button -->
        <div class="flex items-start justify-between gap-4">
            <div class="flex-1 min-w-0 space-y-1">
                <!-- Project/Branch line with status -->
                <div class="flex items-center gap-2">
                    <a href="/dashboard/projects/{{.ProjectID}}" class="text-xs text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:underline">
                        {{.ProjectID}}
                    </a>
                    <span class="text-gray-400 dark:text-gray-500">/</span>
                    <span class="font-mono text-xs font-semibold text-gray-900 dark:text-white">{{.Name}}</span>
                    {{template "partials/status_badge" .}}
                </div>

                <!-- Commit message -->
                <div class="text-sm text-gray-900 dark:text-gray-100">{{.CommitMessage}}</div>
            </div>

            <!-- View button -->
            <a href="/dashboard/runs/{{.ID}}"
               class="inline-block px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-900 dark:text-white text-xs font-medium rounded transition flex-shrink-0">
                View
            </a>
        </div>

        <!-- Second row: Author, duration, time -->
        <div class="flex items-center gap-3 text-xs text-gray-600 dark:text-gray-400">
            <span>{{.Author}}</span>
            <span>•</span>
            {{if .DurationSeconds}}
                <span>{{formatDuration .DurationSeconds}}</span>
                <span>•</span>
            {{end}}
            <span>{{formatTime .TriggeredAt}}</span>
        </div>
    </div>
</div>
{{end}}
