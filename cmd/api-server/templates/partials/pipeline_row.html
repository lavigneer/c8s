{{define "partials/pipeline_row"}}
<div class="pipeline-row hover:bg-gray-50 dark:hover:bg-gray-700 transition p-4 border-b border-gray-200 dark:border-gray-700" id="pipeline-{{.ID}}">
    <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
        <!-- Pipeline Info -->
        <div class="md:col-span-2">
            <div class="font-semibold text-gray-900 dark:text-white text-lg">{{.Name}}</div>
            <div class="pipeline-meta text-sm text-gray-600 dark:text-gray-400 mt-1 space-y-1">
                <div>
                    <span class="font-mono bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 px-2 py-1 rounded text-xs cursor-pointer transition text-gray-900 dark:text-gray-100"
                          data-copy="{{.CommitSHA}}"
                          title="Click to copy full commit SHA">{{slice .CommitSHA 0 7}}</span>
                    <span class="text-gray-500 dark:text-gray-400">on</span>
                    <span class="font-medium text-gray-900 dark:text-white">{{.Branch}}</span>
                </div>
                <div class="text-xs text-gray-600 dark:text-gray-400">by {{.Author}}</div>
            </div>
        </div>

        <!-- Status -->
        <div class="flex items-center">
            {{template "partials/status_badge" .}}
        </div>

        <!-- Timing -->
        <div class="text-sm text-gray-600 dark:text-gray-400 text-center">
            <div class="font-medium text-gray-900 dark:text-white">{{formatTime .TriggeredAt}}</div>
            {{if .DurationSeconds}}
                <div class="text-xs text-gray-500 dark:text-gray-400">{{formatDuration .DurationSeconds}}</div>
            {{end}}
        </div>

        <!-- Actions -->
        <div class="flex gap-2 justify-end">
            <a href="/dashboard/runs/{{.ID}}"
               class="inline-block px-4 py-2 bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-600 text-white text-sm font-medium rounded-lg transition">
                View Details
            </a>
        </div>
    </div>
</div>
{{end}}
