{{define "partials/pipeline_row"}}
<div class="pipeline-row hover:bg-gray-50 dark:hover:bg-gray-700/20 transition p-3 border-b border-gray-200 dark:border-gray-700" id="pipeline-{{.ID}}">
    <div class="flex flex-col gap-2">
        <!-- First row: Project/Branch, Commit message, Status, View button -->
        <div class="flex items-start gap-3">
            <!-- Project/Branch and commit info -->
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-xs font-medium text-gray-600 dark:text-gray-400">{{.ProjectID}}</span>
                    <span class="text-xs text-gray-400 dark:text-gray-500">/</span>
                    <span class="text-xs font-mono font-semibold text-gray-900 dark:text-white">{{.Name}}</span>
                    {{template "partials/status_badge" .}}
                </div>
                <div class="text-sm text-gray-900 dark:text-gray-100 truncate">{{.CommitSHA}}</div>
            </div>

            <!-- View button -->
            <a href="/dashboard/runs/{{.ID}}"
               class="inline-block px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-900 dark:text-white text-xs font-medium rounded transition flex-shrink-0">
                View
            </a>
        </div>

        <!-- Second row: Author, duration, time -->
        <div class="flex items-center gap-3 text-xs text-gray-600 dark:text-gray-400">
            <span>{{.Author}}</span>
            <span>•</span>
            {{if .DurationSeconds}}
                <span>{{formatDuration .DurationSeconds}}</span>
                <span>•</span>
            {{end}}
            <span>{{formatTime .TriggeredAt}}</span>
        </div>
    </div>
</div>
{{end}}
