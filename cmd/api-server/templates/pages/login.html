{{define "login"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - C8S Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/ext/response-targets.js"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        @media (prefers-color-scheme: dark) {
            .login-container {
                background: linear-gradient(135deg, #4c51bf 0%, #5a3d8a 100%);
            }
        }

        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        @media (prefers-color-scheme: dark) {
            .login-box {
                background: #1f2937;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        @media (prefers-color-scheme: dark) {
            .login-logo {
                color: #818cf8;
            }
        }

        .login-title {
            color: #1f2937;
            font-size: 1.875rem;
            font-weight: 700;
        }

        @media (prefers-color-scheme: dark) {
            .login-title {
                color: #f9fafb;
            }
        }

        .login-subtitle {
            color: #6b7280;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        @media (prefers-color-scheme: dark) {
            .login-subtitle {
                color: #9ca3af;
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: #374151;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        @media (prefers-color-scheme: dark) {
            .form-label {
                color: #d1d5db;
            }
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 1rem;
            transition: border-color 0.2s;
            background: white;
            color: #1f2937;
        }

        @media (prefers-color-scheme: dark) {
            .form-input {
                background: #374151;
                border-color: #4b5563;
                color: #f9fafb;
            }
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            .form-input:focus {
                border-color: #818cf8;
                box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
            }
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        @media (prefers-color-scheme: dark) {
            .form-input::placeholder {
                color: #6b7280;
            }
        }

        .login-button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        @media (prefers-color-scheme: dark) {
            .login-button {
                background: linear-gradient(135deg, #818cf8 0%, #9333ea 100%);
            }
        }

        .login-button:hover {
            transform: translateY(-2px);
        }

        .login-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            .login-error {
                background-color: #7f1d1d;
                color: #fecaca;
            }
        }

        .login-error.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        @media (prefers-color-scheme: dark) {
            .login-footer {
                color: #9ca3af;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">C8S</div>
                <h1 class="login-title">Sign In</h1>
                <p class="login-subtitle">CI/CD Pipeline Dashboard</p>
            </div>

            <div id="error-message" class="login-error" role="alert" aria-live="assertive" aria-atomic="true"></div>

            <form id="login-form"
                  hx-ext="response-targets"
                  hx-post="/login"
                  hx-target-400="#error-message"
                  hx-target-422="#error-message"
                  hx-target-5*="#error-message"
                  hx-swap="innerHTML"
                  hx-on="submit: validateLoginForm(event)">
                <div class="form-group">
                    <label for="username" class="form-label">Username or Email</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                        aria-describedby="username-error"
                        hx-on="input: this.removeAttribute('aria-invalid'); this.setCustomValidity('')">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                        aria-describedby="password-error"
                        hx-on="input: this.removeAttribute('aria-invalid'); this.setCustomValidity('')">
                </div>

                <div class="form-group">
                    <label class="flex items-center">
                        <input
                            type="checkbox"
                            name="remember"
                            class="w-4 h-4 text-purple-600 dark:text-purple-400"
                            style="accent-color: #667eea;">
                        <span class="ml-2 text-sm text-gray-600 dark:text-gray-400">Remember me</span>
                    </label>
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="login-button">
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                <p>Need help? <a href="#" class="text-purple-600 dark:text-purple-400 hover:underline">Contact support</a></p>
            </div>
        </div>
    </div>

    <script>
        // Validate form before HTMX submission
        function validateLoginForm(evt) {
            const form = evt.detail.target;
            const errorDiv = document.getElementById('error-message');
            const usernameInput = form.querySelector('input[name="username"]');
            const passwordInput = form.querySelector('input[name="password"]');

            // Clear previous errors
            errorDiv.textContent = '';
            errorDiv.classList.remove('show');
            document.querySelectorAll('[aria-invalid="true"]').forEach(el => {
                el.removeAttribute('aria-invalid');
            });

            // Check validation
            if (!form.checkValidity()) {
                evt.preventDefault();

                const invalidField = form.querySelector(':invalid');
                if (invalidField) {
                    invalidField.setAttribute('aria-invalid', 'true');
                    const fieldName = invalidField.name;
                    const message = fieldName === 'username'
                        ? 'Username or email is required.'
                        : fieldName === 'password'
                        ? 'Password is required.'
                        : 'Please fill in all required fields.';

                    errorDiv.textContent = message;
                    errorDiv.classList.add('show');
                    invalidField.focus();
                }
                return;
            }

            // Clear errors before HTMX request
            errorDiv.textContent = '';
            errorDiv.classList.remove('show');
        }

        // Show server errors from response-targets
        document.addEventListener('htmx:beforeSwap', function(evt) {
            if (evt.detail.target.id !== 'error-message') return;
            evt.detail.target.classList.add('show');
        });

        // Handle successful login - navigate to dashboard
        document.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id !== 'login-form') return;
            // If no error message is shown, login was successful
            const errorDiv = document.getElementById('error-message');
            if (!errorDiv.classList.contains('show')) {
                // Wait a moment for any redirects, then navigate
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 100);
            }
        });

        // Clear error indicator when user types
        document.querySelectorAll('input[required]').forEach(input => {
            input.addEventListener('input', function() {
                if (this.value.trim()) {
                    this.removeAttribute('aria-invalid');
                }
            });
        });

        // Handle keyboard shortcuts on login page
        document.addEventListener('keydown', (e) => {
            if (e.key === '?') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
{{end}}
