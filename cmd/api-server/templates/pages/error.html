{{define "error"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - C8S Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <div class="text-center">
                <div class="text-6xl font-bold text-red-500 mb-4">{{.ErrorCode}}</div>
                <h1 class="text-2xl font-bold text-gray-900 mb-2">Oops!</h1>
                <p class="text-gray-600 mb-6">{{.ErrorMessage}}</p>
                <p class="text-sm text-gray-500 mb-8">
                    {{if .ErrorDetails}}
                        <code class="bg-gray-100 px-2 py-1 rounded text-xs">{{.ErrorDetails}}</code>
                    {{end}}
                </p>
                <div class="flex gap-4 justify-center">
                    <a href="/dashboard" class="inline-block px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors duration-200">
                        Back to Dashboard
                    </a>
                    <button onclick="window.history.back()" class="inline-block px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-900 font-semibold rounded-lg transition-colors duration-200">
                        Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
{{end}}
