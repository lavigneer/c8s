kind: ServiceAccount
metadata:
  name: c8s-webhook
  namespace: c8s-system
  labels:
    app: c8s-webhook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c8s-webhook
  labels:
    app: c8s-webhook
rules:
- apiGroups:
  - c8s.dev
  resources:
  - pipelineruns
  - pipelineconfigs
  - repositoryconnections
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-webhook
  labels:
    app: c8s-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c8s-webhook
subjects:
- kind: ServiceAccount
