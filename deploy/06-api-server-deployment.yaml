apiVersion: apps/v1
kind: Deployment
metadata:
  name: c8s-api-server
  namespace: c8s-system
  labels:
    app: c8s-api-server
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: c8s-api-server
  template:
    metadata:
      labels:
        app: c8s-api-server
    spec:
      serviceAccountName: c8s-api-server
      containers:
      - name: api-server
        image: c8s-api-server:latest
        imagePullPolicy: Never  # Use local image for development
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        args:
        - "-port=:8080"
        - "-base-dir=/app"
        env:
        - name: LOG_LEVEL
          value: "debug"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/c8s
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: c8s-api-server-config
          optional: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: c8s-api-server
  namespace: c8s-system
  labels:
    app: c8s-api-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: c8s-api-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c8s-api-server
  namespace: c8s-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: c8s-api-server
  namespace: c8s-system
rules:
# Read PipelineConfigs and PipelineRuns
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["c8s.dev"]
  resources: ["pipelineconfigs", "pipelineruns"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Read pods and logs for monitoring
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c8s-api-server
  namespace: c8s-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: c8s-api-server
subjects:
- kind: ServiceAccount
  name: c8s-api-server
  namespace: c8s-system
