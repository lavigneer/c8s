kind: ServiceAccount
metadata:
  name: c8s-controller
  namespace: c8s-system
  labels:
    app.kubernetes.io/name: c8s
    app.kubernetes.io/component: controller
---
apiVersion: apps/v1
---
  name: c8s-controller-rolebinding
  labels:
    app.kubernetes.io/name: c8s
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c8s-controller-role
subjects:
  - kind: ServiceAccount
    name: c8s-controller
    namespace: c8s-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controller-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - c8s.dev
  resources:
  - pipelineconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - c8s.dev
  resources:
  - pipelineruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - c8s.dev
  resources:
  - pipelineruns/finalizers
  verbs:
  - update
- apiGroups:
  - c8s.dev
  resources:
  - pipelineruns/status
  verbs:
  - get
  - patch
  - update
apiVersion: v1
kind: ServiceAccount
